spring.application.name=api-grpc
# Puerto HTTP solo para actuator/prometheus (REST usa 8080)
server.port=8081
# Puerto gRPC
spring.grpc.server.port=9091

# Base de datos (solo lectura). El schema define la arquitectura: lambda o kappa
spring.datasource.url=jdbc:postgresql://localhost:5433/bidb?currentSchema=lambda
spring.datasource.username=ram
spring.datasource.password=ram123
# Mismo valor que api-rest para que la comparacion sea justa
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20
spring.datasource.driver-class-name=org.postgresql.Driver

# Mismo modelo de hilos que api-rest
spring.threads.virtual.enabled=true

# Limites de la API (identicos a api-rest)
api.max-range-days=366
api.max-limit=100

# Metricas para Prometheus: /actuator/prometheus
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.prometheus.enabled=true
