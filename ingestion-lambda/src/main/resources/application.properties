spring.application.name=ingestion-lambda
spring.datasource.url=jdbc:postgresql://localhost:5433/bidb?currentSchema=lambda&reWriteBatchedInserts=true
spring.datasource.username=ram
spring.datasource.password=ram123
spring.flyway.schemas=lambda
spring.flyway.default-schema=lambda
spring.flyway.create-schemas=true
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.threads.virtual.enabled=true

# Kafka (capa speed)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.type=batch
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=5000
spring.main.keep-alive=true

# Que capas corren
ingestion.batch.enabled=true
ingestion.speed.enabled=true
ingestion.topic=events

# Batch
ingestion.csv-path=../data/sample.csv
ingestion.chunk-size=10000