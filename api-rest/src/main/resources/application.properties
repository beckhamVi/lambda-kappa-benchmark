spring.application.name=api-rest
server.port=8080

# Base de datos (solo lectura). El schema define la arquitectura: lambda o kappa
spring.datasource.url=jdbc:postgresql://localhost:5433/bidb?currentSchema=lambda
spring.datasource.username=ram
spring.datasource.password=ram123
# Mismo valor que api-grpc para que la comparacion sea justa
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20

# Mismo modelo de hilos que api-grpc
spring.threads.virtual.enabled=true

# Limites de la API
api.max-range-days=366
api.max-limit=100

# Metricas para Prometheus: /actuator/prometheus
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Propiedades agregadas para activar la telemetria y conexion en Docker
management.endpoint.prometheus.enabled=true
spring.datasource.driver-class-name=org.postgresql.Driver

#Grafana
spring.datasource.hikari.register-mbeans=true
